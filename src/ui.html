<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purple Bot</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--text:#1d1b2b;--mute:#6b6880;--line:#e3e0ef;--accent:#5b21b6;--green:#16a34a;--red:#dc2626;--amber:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#14121f;--card:#1e1b2e;--text:#ece9f8;--mute:#a29fb8;--line:#2f2b45;--accent:#a78bfa;--green:#4ade80;--red:#f87171;--amber:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px}
nav button{background:none;border:1px solid transparent;border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:#fff}
main{padding:0 16px 40px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
input,select,textarea,button{font:inherit;color:var(--text)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%}
label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:2px}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 13px;cursor:pointer}
button.btn.gray{background:var(--line);color:var(--text)}
button.btn.red{background:var(--red)}
button.btn.green{background:var(--green)}
button.btn.amber{background:var(--amber)}
button:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--green);border-color:var(--green)}.pill.bad{color:var(--red);border-color:var(--red)}.pill.warn{color:var(--amber);border-color:var(--amber)}
.mute{color:var(--mute)}.g{color:var(--green)}.r{color:var(--red)}
.banner{padding:10px 14px;border-radius:10px;margin:12px 0;border:1px solid var(--amber);color:var(--amber)}
.banner.bad{border-color:var(--red);color:var(--red)}
.msg{white-space:pre-wrap;padding:8px 10px;border-radius:10px;margin:6px 0;background:var(--bg)}
.msg.user{background:var(--accent);color:#fff}
canvas{width:100%;height:320px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.login{max-width:340px;margin:12vh auto}
small{color:var(--mute)}
.hidden{display:none}
.chk{display:inline-flex;gap:4px;align-items:center;margin:2px 8px 2px 0;font-size:13px;color:var(--text)}
</style>
</head>
<body>
<div id="login" class="login hidden card">
  <h2>Purple Bot</h2>
  <label>Password</label>
  <div style="position:relative">
    <input id="pw" type="password" style="width:100%;padding-right:46px" autocomplete="current-password">
    <button type="button" id="pwEye" aria-label="Show password" title="Show password" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px 8px;cursor:pointer;color:var(--mute);line-height:0"></button>
  </div>
  <p><button class="btn" id="loginBtn">Sign in</button> <span id="loginErr" class="r"></span></p>
</div>

<div id="app" class="hidden">
<header>
  <h1>Purple Bot</h1>
  <span id="hBalance" class="pill">Balance —</span>
  <span id="hConn" class="pill">—</span>
  <span style="flex:1"></span>
  <button class="btn red" id="emergencyBtn">EMERGENCY SHUTDOWN</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>

<script>
(function(){
'use strict';
var $=function(s,el){return (el||document).querySelector(s)};
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k];
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.indexOf('on')===0)el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c==null||c===false)continue;
    if(Array.isArray(c)){c.forEach(function(x){if(x!=null)el.appendChild(typeof x==='string'?document.createTextNode(x):x)});}
    else el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);
  }
  return el;
}
function api(path,opts){
  opts=opts||{};
  var init={method:opts.method||'GET',headers:{}};
  if(init.method!=='GET'){init.headers['X-PB']='1';init.headers['Content-Type']='application/json';init.body=JSON.stringify(opts.body||{});}
  return fetch('/api'+path,init).then(function(r){
    if(r.status===401&&path!=='/login'){showLogin();throw new Error('Not signed in');}
    return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;});
  });
}
function pct(x){return x==null?'—':(x*100).toFixed(1)+'%'}
function usd(x){return x==null?'—':(x<0?'-':'')+'$'+Math.abs(x).toFixed(2)}
function when(ts){return ts?new Date(ts).toLocaleString():'—'}
function hm(ts){return ts?new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'}
function dur(ms){if(ms==null)return '—';var s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+'m '+('0'+(s%60)).slice(-2)+'s'}
function pnlCls(x){return x>0?'g':x<0?'r':''}
function toast(msg,bad){var d=h('div',{class:'banner'+(bad?' bad':''),text:msg});var m=$('#main');m.insertBefore(d,m.firstChild);setTimeout(function(){d.remove()},bad?9000:4000)}
function act(p,opts,okMsg){return api(p,opts).then(function(r){if(okMsg)toast(okMsg);return r}).catch(function(e){toast(e.message,true);throw e})}

var TABS=['Dashboard','Bots','Trades','Charts','AI','Backtest','Settings','Logs'];
var tab='Dashboard',live=null,pollTimer=null,settings=null,botsCache=[];

function showLogin(){$('#app').classList.add('hidden');$('#login').classList.remove('hidden');if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');buildNav();go(tab)}
var EYE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
(function(){
  var pw=$('#pw'),eye=$('#pwEye');
  eye.innerHTML=EYE;
  eye.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    eye.innerHTML=show?EYE_OFF:EYE;
    eye.setAttribute('aria-label',show?'Hide password':'Show password');
    eye.title=show?'Hide password':'Show password';
    pw.focus();
  });
})();
$('#loginBtn').addEventListener('click',doLogin);
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
function doLogin(){api('/login',{method:'POST',body:{password:$('#pw').value}}).then(function(){$('#pw').value='';showApp()}).catch(function(e){$('#loginErr').textContent=e.message})}

function buildNav(){
  var n=$('#nav');n.textContent='';
  TABS.forEach(function(t){n.appendChild(h('button',{class:t===tab?'on':'',text:t,onclick:function(){go(t)}}))});
}
function go(t){tab=t;buildNav();if(pollTimer){clearInterval(pollTimer);pollTimer=null}
  var v={Dashboard:vDash,Bots:vBots,Trades:vTrades,Charts:vCharts,AI:vAI,Backtest:vBacktest,Settings:vSettings,Logs:vLogs}[t];
  $('#main').textContent='';v();}

$('#emergencyBtn').addEventListener('click',function(){
  if(!confirm('EMERGENCY SHUTDOWN: turn every bot OFF and try to close every open position now. Continue?'))return;
  act('/emergency',{method:'POST'},'Emergency shutdown started').then(function(r){toast('Closing '+r.closing+' position(s)')});
});

function updateHeader(){
  if(!live)return;
  $('#hBalance').textContent='Balance '+usd(live.balance)+(live.portfolioValue!=null?' · Portfolio '+usd(live.portfolioValue):'');
  var c=$('#hConn');
  c.className='pill '+(live.connected?'ok':live.restFallback?'warn':'bad');
  c.textContent=live.connected?'Live feed connected':live.restFallback?'Live feed down — slow backup mode':'Live feed offline';
}

// ----------------------------------------------------------------- Dashboard
function vDash(){
  var root=$('#main');
  var lastBots=0;
  var banner=h('div'),acct=h('div'),mk=h('div'),bt=h('div'),pos=h('div');
  root.appendChild(banner);root.appendChild(mk);root.appendChild(bt);root.appendChild(pos);
  function draw(){
    if(!live)return;
    banner.textContent='';
    if(!live.credentialsOk)banner.appendChild(h('div',{class:'banner bad',text:'Kalshi is not connected (or the key was rejected'+(live.authError?': '+live.authError:'')+'). Go to Settings.'}));
    if(live.reconcileProblem)banner.appendChild(h('div',{class:'banner bad'},['New orders are blocked: '+live.reconcileProblem+' ',h('button',{class:'btn gray',text:'Reconcile now',onclick:function(){act('/reconcile',{method:'POST'},'Checked')}})]));
    else if(live.credentialsOk&&!live.reconciled)banner.appendChild(h('div',{class:'banner',text:'Checking your Kalshi account before any trading is allowed…'}));
    // markets
    var rows=live.assets.map(function(a){
      var closed=!a.ticker;
      return h('tr',null,
        h('td',{text:a.asset}),
        h('td',{class:'g',text:closed?'—':pct(a.yes)}),
        h('td',{class:'r',text:closed?'—':pct(a.no)}),
        h('td',{text:closed?'—':(a.bid!=null?a.bid.toFixed(2)+' / '+a.ask.toFixed(2):'—')}),
        h('td',{text:closed?'Closed or between periods'+(a.nextOpenTs?' — next opens '+when(a.nextOpenTs):' (no open contract found for '+a.series+')'):'Opened '+hm(a.openTs)+' · closes '+hm(a.closeTs)+' ('+dur(a.closeTs-live.now)+' left)'}),
        h('td',{class:'mute',text:a.quoteAgeMs==null?'':Math.round(a.quoteAgeMs/1000)+'s ago'}));
    });
    mk.textContent='';
    mk.appendChild(h('div',{class:'card'},h('h2',{text:'Live markets'}),h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,['Asset','YES (up)','NO (down)','Bid / Ask','Contract','Update'].map(function(x){return h('th',{text:x})}))),h('tbody',null,rows.length?rows:[h('tr',null,h('td',{colspan:6,class:'mute',text:'No assets tracked yet. Create a bot, then Start it (or just open this page after creating one).'}))])))));
    // bots
    function renderBots(bots){
      bt.textContent='';
      bots.forEach(function(b){
        var st=live.bots.find(function(x){return x.id===b.id})||{reason:'',up:0,down:0};
        bt.appendChild(h('div',{class:'card'},
          h('div',{class:'row'},h('b',{text:b.name}),h('span',{class:'pill '+(b.enabled?'ok':''),text:b.enabled?'ON':'OFF'}),h('span',{class:'mute',text:b.strategy}),
            h('span',{style:'flex:1'}),
            h('button',{class:'btn green',disabled:b.enabled,text:'Start Bot',onclick:function(){act('/bots/'+b.id+'/start',{method:'POST'},'Bot started').then(function(){lastBots=0;refresh()})}}),
            h('button',{class:'btn amber',disabled:!b.enabled,text:'Stop — No New Trades',onclick:function(){act('/bots/'+b.id+'/stop',{method:'POST'},'Stopped: no new trades').then(function(){lastBots=0;refresh()})}}),
            h('button',{class:'btn red',text:'Stop and Close All Positions',onclick:function(){if(confirm('Stop this bot and try to close all of its open positions?'))act('/bots/'+b.id+'/stop-close',{method:'POST'},'Closing positions…').then(function(){lastBots=0;refresh()})}})),
          h('div',{class:'mute',text:'Signal: '+st.reason+(b.strategy==='crypto'?'  (up '+st.up+' / down '+st.down+', need '+b.config.agreeCount+')':'')}),
          h('div',{class:'mute',text:'Trades '+b.perf.trades+' · wins '+b.perf.wins+' · losses '+b.perf.losses+' · P/L '+usd(b.perf.pnl)})));
      });
      if(!bots.length)bt.appendChild(h('div',{class:'card mute',text:'No bots yet — open the Bots tab to create one (bots always start OFF).'}));
    }
    // the bot list (with its performance math) only needs a fresh fetch every 30s or after you press something
    if(botsCache.length&&Date.now()-lastBots<30000)renderBots(botsCache);
    else api('/bots').then(function(b){lastBots=Date.now();botsCache=b;renderBots(b)});
    // positions
    pos.textContent='';
    pos.appendChild(h('div',{class:'card'},h('h2',{text:'Open positions'}),posTable(live.positions)));
  }
  function refresh(){return api('/live').then(function(l){live=l;updateHeader();draw()}).catch(function(){})}
  refresh();pollTimer=setInterval(refresh,5000);
}
function posTable(list){
  if(!list.length)return h('div',{class:'mute',text:'None'});
  return h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,['Asset','Side','Qty','Entry','Fav. prob now','Fav. min / max','Unrealized','Closes'].map(function(x){return h('th',{text:x})}))),
    h('tbody',null,list.map(function(p){return h('tr',null,h('td',{text:p.asset}),h('td',{text:p.outcome.toUpperCase()}),h('td',{text:p.open_qty}),h('td',{text:p.avg_entry!=null?p.avg_entry.toFixed(3):'—'}),h('td',{text:pct(p.favNow)}),h('td',{text:pct(p.fav_min)+' / '+pct(p.fav_max)}),h('td',{class:pnlCls(p.unrealized),text:usd(p.unrealized)}),h('td',{text:hm(p.market_close_ts)}))}))));
}

// ----------------------------------------------------------------- Bots
var CRYPTO=['BTC','ETH','SOL','XRP','DOGE','BNB','HYPE','ADA','BCH','NEAR','TON','ZEC'],METALS=['GOLD','SILVER','PLATINUM','PALLADIUM','COPPER'];
function vBots(){
  var root=$('#main');
  var list=h('div'),form=h('div');
  root.appendChild(h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn',text:'+ New crypto bot',onclick:function(){editBot(null,'crypto')}}),h('button',{class:'btn',text:'+ New metals bot',onclick:function(){editBot(null,'metals')}})));
  root.appendChild(form);root.appendChild(list);
  function load(){api('/bots').then(function(bots){botsCache=bots;list.textContent='';bots.forEach(function(b){
    list.appendChild(h('div',{class:'card'},h('div',{class:'row'},h('b',{text:b.name}),h('span',{class:'pill '+(b.enabled?'ok':''),text:b.enabled?'ON':'OFF'}),h('span',{class:'mute',text:b.strategy+' · trades '+b.config.tradeAsset+' · confirmed by '+b.config.assets.join(', ')}),h('span',{style:'flex:1'}),
      h('button',{class:'btn gray',text:'Edit',onclick:function(){editBot(b)}}),
      h('button',{class:'btn gray',text:'Duplicate',onclick:function(){act('/bots/'+b.id+'/duplicate',{method:'POST'},'Duplicated (OFF)').then(load)}}),
      h('button',{class:'btn gray',text:'Delete',onclick:function(){if(confirm('Delete '+b.name+'? Trade history is kept.'))act('/bots/'+b.id,{method:'DELETE'},'Deleted').then(load)}})),
      h('div',{class:'mute',text:'Prob ≥ '+pct(b.config.probThreshold)+' · delay '+(b.config.timeDelaySec/60)+' min · $'+b.config.tradeAmount+'/trade · stop loss '+(b.config.stopLossOn?usd(b.config.stopLoss):'off')+' · take profit '+(b.config.takeProfitOn?usd(b.config.takeProfit):'off')})));
  })})}
  function field(label,input,hint){return h('div',null,h('label',{text:label}),input,hint?h('small',{text:hint,style:'display:block;margin-top:2px'}):null)}
  function editBot(b,strategy){
    var s=b?b.strategy:strategy;var c=b?b.config:settings&&settings.defaults?settings.defaults[s]:null;
    function go2(){
      var cfg=c;var f=h('div',{class:'card'});
      var name=h('input',{value:b?b.name:(s==='crypto'?'Crypto bot':'Metals bot')});
      var inp={};
      function num(k,mult,step){return inp[k]=h('input',{type:'number',step:step||'any',value:+(cfg[k]*(mult||1)).toFixed(4),style:'width:110px'})}
      function chk(k){return inp[k]=h('input',{type:'checkbox'});}
      var assets=(s==='crypto'?CRYPTO:METALS).map(function(a){var cb=h('input',{type:'checkbox','data-a':a});cb.checked=cfg.assets.indexOf(a)>=0;if(s==='metals'&&(a==='GOLD'||a==='SILVER')){cb.checked=true;cb.disabled=true}return h('label',{class:'chk'},cb,a)});
      var tradeSel=h('select',null,(s==='crypto'?CRYPTO:METALS).map(function(a){var op=h('option',{value:a,text:a});if(cfg.tradeAsset===a)op.selected=true;return op}));
      var sl=chk('stopLossOn');sl.checked=cfg.stopLossOn;var tp=chk('takeProfitOn');tp.checked=cfg.takeProfitOn;
      var nt=h('select',null,['immediate','hourly','daily','off'].map(function(o){var op=h('option',{value:o,text:o});if(cfg.notify===o)op.selected=true;return op}));
      f.appendChild(h('h2',{text:(b?'Edit ':'New ')+s+' bot'}));
      f.appendChild(h('div',{class:'grid'},
        field('Name',name),
        field('Asset to trade',tradeSel,'The only asset this bot buys. The other checked assets only confirm the direction.'),
        field('Probability threshold (%)',num('probThreshold',100,1)),
        s==='crypto'?field('Assets that must agree (of those selected)',num('agreeCount',1,1)):h('div',{class:'mute',text:'Gold and silver must both agree (fixed).'}),
        field('Time Delay after open (seconds, 0–'+((cfg.durationMin-1)*60)+')',num('timeDelaySec',1,1)),
        field('Minimum time remaining (seconds)',num('minRemainingSec',1,1)),
        field('Trade amount ($)',num('tradeAmount'),'Smallest: $1 (the bot buys whole contracts; one costs up to $0.99 plus fees). Kalshi sets no fixed largest amount. Your balance, your daily limits, and how many contracts are available at your price limit it.'),
        field('Max simultaneous positions',num('maxPositions',1,1)),
        field('Max trades per hour',num('maxTradesPerHour',1,1)),
        field('Daily loss limit ($)',num('dailyLossLimit')),
        field('Daily investment limit ($)',num('dailyInvestLimit')),
        field('Max spread allowed ($)',num('maxSpread')),
        field('Stop loss ($ per position)',h('div',{class:'row'},sl,num('stopLoss'))),
        field('Take profit ($ per position)',h('div',{class:'row'},tp,num('takeProfit'))),
        field('Email notifications',nt)));
      f.appendChild(h('div',{style:'margin-top:10px'},h('label',{text:'Assets'}),assets));
      f.appendChild(h('p',null,h('button',{class:'btn',text:'Save',onclick:function(){
        var out={strategy:s,durationMin:cfg.durationMin};
        ['probThreshold'].forEach(function(k){out[k]=+inp[k].value/100});
        ['agreeCount','timeDelaySec','minRemainingSec','tradeAmount','maxPositions','maxTradesPerHour','dailyLossLimit','dailyInvestLimit','maxSpread','stopLoss','takeProfit'].forEach(function(k){if(inp[k])out[k]=+inp[k].value});
        out.tradeAsset=tradeSel.value;
        out.stopLossOn=sl.checked;out.takeProfitOn=tp.checked;out.notify=nt.value;
        out.assets=[].slice.call(f.querySelectorAll('[data-a]')).filter(function(x){return x.checked}).map(function(x){return x.getAttribute('data-a')});
        act(b?'/bots/'+b.id:'/bots',{method:b?'PUT':'POST',body:{name:name.value,config:out}},'Saved').then(function(){form.textContent='';load()});
      }}),' ',h('button',{class:'btn gray',text:'Cancel',onclick:function(){form.textContent=''}})));
      form.textContent='';form.appendChild(f);f.scrollIntoView();
    }
    if(!c){api('/settings').then(function(st){settings=st;c=st.defaults[s];go2()})}else go2();
  }
  load();
}

// ----------------------------------------------------------------- Trades + performance
function vTrades(){
  var root=$('#main');
  var sel=h('select',null,h('option',{value:'',text:'All bots'}));
  var perf=h('div'),open=h('div'),hist=h('div');
  api('/bots').then(function(b){b.forEach(function(x){sel.appendChild(h('option',{value:x.id,text:x.name}))})});
  sel.addEventListener('change',loadPerf);
  root.appendChild(h('div',{class:'row',style:'margin-top:12px'},h('label',{text:'Performance for'}),sel));
  root.appendChild(perf);root.appendChild(open);root.appendChild(hist);
  function grp(title,g){return h('div',{class:'card'},h('h2',{text:title}),h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,['','Trades','Wins','Losses','Win rate','P/L'].map(function(x){return h('th',{text:x})}))),h('tbody',null,g.length?g.map(function(x){return h('tr',null,h('td',{text:x.key}),h('td',{text:x.trades}),h('td',{text:x.wins}),h('td',{text:x.losses}),h('td',{text:x.winRate==null?'—':(x.winRate*100).toFixed(0)+'%'}),h('td',{class:pnlCls(x.pnl),text:usd(x.pnl)}))}):[h('tr',null,h('td',{colspan:6,class:'mute',text:'No data yet'}))]))))}
  function loadPerf(){api('/performance'+(sel.value?'?bot='+sel.value:'')).then(function(p){
    perf.textContent='';
