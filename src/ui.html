<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purple Bot</title>
<style>
/* Muted, professional palette. Bright red/green are kept only for prices, profit/loss and the chart lines. */
:root{--bg:#f4f5f7;--card:#fff;--text:#1f2430;--mute:#667085;--line:#e1e4ea;--accent:#475569;--btn:#3d4657;--btn-text:#fff;--green:#16a34a;--red:#dc2626;--amber:#a8782f;--g-btn:#4d7a5a;--a-btn:#8a6d3b;--r-btn:#9b4d4d;--start:#1f2430}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1a1e27;--text:#e6e9ef;--mute:#98a1b3;--line:#2a303c;--accent:#9aa5b8;--btn:#4a5367;--btn-text:#f1f5f9;--green:#4ade80;--red:#f87171;--amber:#c9a76b;--g-btn:#8fbf9d;--a-btn:#c9a76b;--r-btn:#d99a9a;--start:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;color:var(--text)}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px}
nav button{background:none;border:1px solid transparent;border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;font:inherit}
nav button.on{background:var(--btn);color:var(--btn-text)}
main{padding:0 16px 40px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
input,select,textarea,button{font:inherit;color:var(--text)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%}
label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:2px}
button.btn{background:var(--btn);color:var(--btn-text);border:1px solid var(--btn);border-radius:8px;padding:7px 13px;cursor:pointer}
button.btn.gray{background:transparent;color:var(--text);border-color:var(--line)}
button.btn.green{background:transparent;color:var(--start);border-color:var(--start)}
button.btn.amber{background:transparent;color:var(--a-btn);border-color:var(--a-btn)}
button.btn.red{background:transparent;color:var(--r-btn);border-color:var(--r-btn)}
button.btn:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--green);border-color:var(--green)}.pill.bad{color:var(--red);border-color:var(--red)}.pill.warn{color:var(--amber);border-color:var(--amber)}
.mute{color:var(--mute)}.g{color:var(--green)}.r{color:var(--red)}
.banner{padding:10px 14px;border-radius:10px;margin:12px 0;border:1px solid var(--amber);color:var(--amber)}
.banner.bad{border-color:var(--red);color:var(--red)}
.msg{white-space:pre-wrap;padding:8px 10px;border-radius:10px;margin:6px 0;background:var(--bg)}
.msg.user{background:var(--btn);color:var(--btn-text)}
canvas{width:100%;height:320px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.login{max-width:340px;margin:12vh auto}
small{color:var(--mute)}
.hidden{display:none}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.tile .big{font-size:20px;font-weight:600;margin-top:2px}
a.chatlink{color:var(--text);text-decoration:underline;font-weight:600}
@media (prefers-color-scheme:dark){a.chatlink{color:#fff}}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-align:left}
.chk{display:inline-flex;gap:4px;align-items:center;margin:2px 8px 2px 0;font-size:13px;color:var(--text)}
</style>
</head>
<body>
<div id="login" class="login hidden card">
  <h2>Purple Bot</h2>
  <label>Password</label>
  <div style="position:relative">
    <input id="pw" type="password" style="width:100%;padding-right:46px" autocomplete="current-password">
    <button type="button" id="pwEye" aria-label="Show password" title="Show password" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px 8px;cursor:pointer;color:var(--mute);line-height:0"></button>
  </div>
  <p><button class="btn" id="loginBtn">Sign in</button> <span id="loginErr" class="r"></span></p>
</div>

<div id="app" class="hidden">
<header>
  <h1>Purple Bot</h1>
  <span id="hBalance" class="pill">Balance —</span>
  <span id="hConn" class="pill">—</span>
  <span style="flex:1"></span>
  <button class="btn red" id="emergencyBtn">EMERGENCY SHUTDOWN</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>

<script>
(function(){
'use strict';
var $=function(s,el){return (el||document).querySelector(s)};
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k];
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.indexOf('on')===0)el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c==null||c===false)continue;
    if(Array.isArray(c)){c.forEach(function(x){if(x!=null)el.appendChild(typeof x==='string'?document.createTextNode(x):x)});}
    else el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);
  }
  return el;
}
function api(path,opts){
  opts=opts||{};
  var init={method:opts.method||'GET',headers:{}};
  if(init.method!=='GET'){init.headers['X-PB']='1';init.headers['Content-Type']='application/json';init.body=JSON.stringify(opts.body||{});}
  return fetch('/api'+path,init).then(function(r){
    if(r.status===401&&path!=='/login'){showLogin();throw new Error('Not signed in');}
    return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('Error '+r.status));return j;});
  });
}
function pct(x){return x==null?'—':(x*100).toFixed(1)+'%'}
function usd(x){return x==null?'—':(x<0?'-':'')+'$'+Math.abs(x).toFixed(2)}
function when(ts){return ts?new Date(ts).toLocaleString():'—'}
function hm(ts){return ts?new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'}
function dur(ms){if(ms==null)return '—';var s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+'m '+('0'+(s%60)).slice(-2)+'s'}
function pnlCls(x){return x>0?'g':x<0?'r':''}
function toast(msg,bad){var d=h('div',{class:'banner'+(bad?' bad':''),text:msg});var m=$('#main');m.insertBefore(d,m.firstChild);setTimeout(function(){d.remove()},bad?9000:4000)}
function act(p,opts,okMsg){return api(p,opts).then(function(r){if(okMsg)toast(okMsg);return r}).catch(function(e){toast(e.message,true);throw e})}

var TABS=['Dashboard','Bots','Trades','Charts','AI','Backtest','Settings','Logs'];
// remember the current tab in the address bar (#Settings etc.) so a refresh stays where you were
var tab=(function(){var t='';try{t=decodeURIComponent((location.hash||'').slice(1))}catch(e){}return TABS.indexOf(t)>=0?t:'Dashboard'})();
var live=null,pollTimer=null,settings=null,botsCache=[];

function showLogin(){$('#app').classList.add('hidden');$('#login').classList.remove('hidden');if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
function showApp(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');buildNav();
  var m=(location.hash||'').match(/^#Bot\/(.+)$/);  // refresh while viewing one bot stays on that bot
  if(m){var id='';try{id=decodeURIComponent(m[1])}catch(e){}if(id){tab='Dashboard';buildNav();openBot(id);return}}
  go(tab);
}
var EYE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
(function(){
  var pw=$('#pw'),eye=$('#pwEye');
  eye.innerHTML=EYE;
  eye.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    eye.innerHTML=show?EYE_OFF:EYE;
    eye.setAttribute('aria-label',show?'Hide password':'Show password');
    eye.title=show?'Hide password':'Show password';
    pw.focus();
  });
})();
$('#loginBtn').addEventListener('click',doLogin);
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
function doLogin(){api('/login',{method:'POST',body:{password:$('#pw').value}}).then(function(){$('#pw').value='';showApp()}).catch(function(e){$('#loginErr').textContent=e.message})}

function buildNav(){
  var n=$('#nav');n.textContent='';
  TABS.forEach(function(t){n.appendChild(h('button',{class:t===tab?'on':'',text:t,onclick:function(){go(t)}}))});
}
function go(t){tab=t;try{history.replaceState(null,'','#'+encodeURIComponent(t))}catch(e){}buildNav();if(pollTimer){clearInterval(pollTimer);pollTimer=null}
  var v={Dashboard:vDash,Bots:vBots,Trades:vTrades,Charts:vCharts,AI:vAI,Backtest:vBacktest,Settings:vSettings,Logs:vLogs}[t];
  $('#main').textContent='';v();
  // the Dashboard refreshes the header every few seconds on its own; on every other tab, load the balance once per switch
  if(t!=='Dashboard')api('/live').then(function(l){live=l;updateHeader()}).catch(function(){});
}

$('#emergencyBtn').addEventListener('click',function(){
  if(!confirm('EMERGENCY SHUTDOWN: turn every bot OFF and try to close every open position now. Continue?'))return;
  act('/emergency',{method:'POST'},'Emergency shutdown started').then(function(r){toast('Closing '+r.closing+' position(s)')});
});

function updateHeader(){
  if(!live)return;
  $('#hBalance').textContent='Balance '+usd(live.balance)+(live.portfolioValue!=null?' · Portfolio '+usd(live.portfolioValue):'');
  var c=$('#hConn');
  c.className='pill '+(live.connected?'ok':live.restFallback?'warn':'bad');
  c.textContent=live.connected?'Live feed connected':live.restFallback?'Live feed down — slow backup mode':'Live feed offline';
}

// ----------------------------------------------------------------- Dashboard
function vDash(){
  var root=$('#main');
  var lastBots=0,lastAcct=0,acctData=null;
  var banner=h('div'),acct=h('div'),mk=h('div'),bt=h('div'),pos=h('div');
  // top to bottom: money picture, what is open right now, the bots that trade it, then the live market table
  root.appendChild(banner);root.appendChild(acct);root.appendChild(pos);root.appendChild(bt);root.appendChild(mk);
  function drawAcct(){
    acct.textContent='';
    var a=acctData;
    var unreal=live.positions.reduce(function(s,p){return s+(p.unrealized||0)},0);
    var total=(live.balance!=null&&live.portfolioValue!=null)?live.balance+live.portfolioValue:null;
    // related numbers sit together, each group under its own small heading
    var groups=[tileGroup('Account value',[tile('Cash balance',usd(live.balance)),tile('Portfolio value',usd(live.portfolioValue)),tile('Account total',usd(total))])];
    if(a){
      var lossToday=Math.max(0,-a.today.pnl);
      groups.push(
        tileGroup('Open trades',[
          tile('Open now',a.openCount+' · '+usd(a.openExposure)+' put in'),
          tile('Profit/loss on open trades (if closed now)',usd(unreal),pnlCls(unreal))]),
        tileGroup('Closed trades: profit/loss after fees',[
          tile('Today',usd(a.today.pnl),pnlCls(a.today.pnl)),
          tile('Last 7 days',usd(a.week.pnl),pnlCls(a.week.pnl)),
          tile('All time',usd(a.all.pnl),pnlCls(a.all.pnl)),
          tile('Fees paid (all time)',usd(a.all.fees))]),
        tileGroup('Results',[
          tile('Win rate (all time)',a.all.winRate==null?'—':(a.all.winRate*100).toFixed(0)+'%  ('+a.all.wins+'W / '+a.all.losses+'L)'),
          tile('Trades today / all time',a.today.trades+' / '+a.all.trades)]),
        tileGroup('Daily limits (all bots)',[
          tile('Invested today',usd(a.investedToday)+' of '+usd(a.limits.dailyInvestLimit)),
          tile('Loss today',usd(lossToday)+' of '+usd(a.limits.dailyLossLimit))])
      );
    }
    acct.appendChild(h('div',{class:'card'},h('h2',{text:'Account'}),groups,h('small',{text:'Balance and portfolio come straight from Kalshi. Profit/loss is from this bot\'s own trades, after fees. The daily limits are the account-wide limits from Settings. Each bot has its own limits, shown on its page: tap a bot below.'})));
  }
  function draw(){
    if(!live)return;
    drawAcct();
    if(!acctData||Date.now()-lastAcct>30000){lastAcct=Date.now();api('/account').then(function(a){acctData=a;drawAcct()}).catch(function(){})}
    banner.textContent='';
    if(!live.credentialsOk)banner.appendChild(h('div',{class:'banner bad',text:'Kalshi is not connected (or the key was rejected'+(live.authError?': '+live.authError:'')+'). Go to Settings.'}));
    if(live.reconcileProblem)banner.appendChild(h('div',{class:'banner bad'},['New orders are blocked: '+live.reconcileProblem+' ',h('button',{class:'btn gray',text:'Reconcile now',onclick:function(){act('/reconcile',{method:'POST'},'Checked')}})]));
    else if(live.credentialsOk&&!live.reconciled)banner.appendChild(h('div',{class:'banner',text:'Checking your Kalshi account before any trading is allowed…'}));
    // markets
    var rows=live.assets.map(function(a){
      var closed=!a.ticker;
      return h('tr',null,
        h('td',{text:a.asset}),
        h('td',{class:'g',text:closed?'—':pct(a.yes)}),
        h('td',{class:'r',text:closed?'—':pct(a.no)}),
        h('td',{text:closed?'—':(a.bid!=null?a.bid.toFixed(2)+' / '+a.ask.toFixed(2):'—')}),
        h('td',{text:closed?'Closed or between periods'+(a.nextOpenTs?' — next opens '+when(a.nextOpenTs):' (no open contract found for '+a.series+')'):'Opened '+hm(a.openTs)+' · closes '+hm(a.closeTs)+' ('+dur(a.closeTs-live.now)+' left)'}),
        h('td',{class:'mute',text:a.quoteAgeMs==null?'':Math.round(a.quoteAgeMs/1000)+'s ago'}));
    });
    mk.textContent='';
    mk.appendChild(h('div',{class:'card'},h('h2',{text:'Live markets'}),h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,['Asset','YES (up)','NO (down)','Bid / Ask','Contract','Update'].map(function(x){return h('th',{text:x})}))),h('tbody',null,rows.length?rows:[h('tr',null,h('td',{colspan:6,class:'mute',text:'No assets tracked yet. Create a bot, then Start it (or just open this page after creating one).'}))])))));
    // bots
    function renderBots(bots){
      bt.textContent='';
      bots.forEach(function(b){
        var st=live.bots.find(function(x){return x.id===b.id})||{reason:'',up:0,down:0};
        bt.appendChild(h('div',{class:'card'},
          h('div',{class:'row'},h('button',{class:'link',text:b.name+' ›',title:'See this bot\'s profit/loss',onclick:function(){openBot(b.id)}}),h('span',{class:'pill '+(b.enabled?'ok':''),text:b.enabled?'ON':'OFF'}),h('span',{class:'mute',text:b.strategy+' · trades '+b.config.tradeAsset}),
            ),
          h('div',{class:'mute',text:'Signal: '+st.reason+(b.strategy==='crypto'?'  (up '+st.up+' / down '+st.down+', need '+b.config.agreeCount+')':'')}),
          h('div',{class:'mute',text:'Tap the bot name to see its profit/loss.'})));
      });
      if(!bots.length)bt.appendChild(h('div',{class:'card mute',text:'No bots yet — open the Bots tab to create one (bots always start OFF).'}));
    }
    // the bot list (with its performance math) only needs a fresh fetch every 30s or after you press something
    if(botsCache.length&&Date.now()-lastBots<30000)renderBots(botsCache);
    else api('/bots').then(function(b){lastBots=Date.now();botsCache=b;renderBots(b)});
    // positions
    pos.textContent='';
    pos.appendChild(h('div',{class:'card'},h('h2',{text:'Open positions'}),posTable(live.positions)));
  }
  function refresh(){return api('/live').then(function(l){live=l;updateHeader();draw()}).catch(function(){})}
  refresh();pollTimer=setInterval(refresh,5000);
}
function tileGroup(title,tiles){return h('div',{style:'margin-top:12px'},h('div',{class:'mute',style:'font-weight:600;margin-bottom:6px',text:title}),h('div',{class:'grid'},tiles))}
function tile(label,value,cls){return h('div',{class:'tile'},h('small',{text:label}),h('div',{class:'big '+(cls||''),text:value}))}
function botButtons(b,after){
  return [
    h('button',{class:'btn green',disabled:b.enabled,text:'Start Bot',onclick:function(){act('/bots/'+b.id+'/start',{method:'POST'},'Bot started').then(after)}}),
    h('button',{class:'btn amber',disabled:!b.enabled,text:'Stop — No New Trades',onclick:function(){act('/bots/'+b.id+'/stop',{method:'POST'},'Stopped: no new trades').then(after)}}),
    h('button',{class:'btn red',text:'Stop and Close All Positions',onclick:function(){if(confirm('Stop this bot and try to close all of its open positions?'))act('/bots/'+b.id+'/stop-close',{method:'POST'},'Closing positions…').then(after)}})
  ];
}
function closedTable(rows){
  if(!rows.length)return h('div',{class:'mute',text:'No completed trades yet'});
  return h('div',{class:'scroll'},h('table',null,h('thead',null,h('tr',null,['Closed','Asset','Side','Qty','Entry','Amount','Entry prob','Exit prob','Fav min / max','How','Result','P/L'].map(function(x){return h('th',{text:x})}))),
    h('tbody',null,rows.map(function(p){return h('tr',null,h('td',{text:when(p.closed_ts)}),h('td',{text:p.asset}),h('td',{text:p.outcome.toUpperCase()}),h('td',{text:p.entry_qty}),h('td',{text:p.avg_entry!=null?p.avg_entry.toFixed(3):'—'}),h('td',{text:usd(p.entry_cost)}),h('td',{text:pct(p.entry_prob)}),h('td',{text:pct(p.exit_prob)}),h('td',{text:pct(p.fav_min)+' / '+pct(p.fav_max)}),h('td',{text:p.close_reason||''}),h('td',{text:p.result||''}),h('td',{class:pnlCls(p.realized_pnl),text:usd(p.realized_pnl)}))}))));
}

// one bot's own profit/loss page (opened by tapping the bot's name on the Dashboard)
function openBot(id){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null}
  try{history.replaceState(null,'','#Bot/'+encodeURIComponent(id))}catch(e){}
  var root=$('#main');root.textContent='';
  root.appendChild(h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn gray',text:'← Back to Dashboard',onclick:function(){go('Dashboard')}})));
  var body=h('div');root.appendChild(body);
  function load(){
    Promise.all([api('/bots/'+id+'/summary'),api('/live')]).then(function(r){
      var s=r[0];live=r[1];updateHeader();
      var b=s.bot,cfg=b.config;
      var mine=live.positions.filter(function(p){return p.bot_id===id});
      var unreal=mine.reduce(function(t,p){return t+(p.unrealized||0)},0);
      var st=live.bots.find(function(x){return x.id===id})||{reason:''};
      var lossToday=Math.max(0,-s.today.pnl);
      body.textContent='';
      body.appendChild(h('div',{class:'card'},
        h('div',{class:'row'},h('h2',{text:b.name,style:'margin:0'}),h('span',{class:'pill '+(b.enabled?'ok':''),text:b.enabled?'ON':'OFF'}),h('span',{class:'mute',text:cfg.strategy+' · trades '+cfg.tradeAsset+' · confirmed by '+cfg.assets.join(', ')})),
        h('div',{class:'mute',style:'margin-top:8px',text:'Signal: '+st.reason})));
      body.appendChild(h('div',{class:'card'},h('h2',{text:'Profit / loss — this bot only'}),[
        tileGroup('Open trades',[
          tile('Open now',s.openCount+' · '+usd(s.openExposure)+' put in'),
          tile('Profit/loss on open trades (if closed now)',usd(unreal),pnlCls(unreal))]),
        tileGroup('Closed trades: profit/loss after fees',[
          tile('Today',usd(s.today.pnl),pnlCls(s.today.pnl)),
          tile('Last 7 days',usd(s.week.pnl),pnlCls(s.week.pnl)),
          tile('All time',usd(s.all.pnl),pnlCls(s.all.pnl)),
          tile('Fees paid (all time)',usd(s.all.fees))]),
        tileGroup('Results',[
          tile('Win rate (all time)',s.all.winRate==null?'—':(s.all.winRate*100).toFixed(0)+'%  ('+s.all.wins+'W / '+s.all.losses+'L)'),
          tile('Trades today / all time',s.today.trades+' / '+s.all.trades)]),
        tileGroup('Daily limits (this bot)',[
          tile('Invested today',usd(s.investedToday)+' of '+usd(cfg.dailyInvestLimit)),
          tile('Loss today',usd(lossToday)+' of '+usd(cfg.dailyLossLimit))]),
        h('small',{text:'After fees, from this bot\'s own trades.'})]));
      body.appendChild(h('div',{class:'card'},h('h2',{text:'Open positions'}),posTable(mine)));
      body.appendChild(h('div',{class:'card'},h('h2',{text:'Completed trades (latest 50)'}),closedTable(s.closed)));
    }).catch(function(e){body.textContent='';body.appendChild(h('div',{class:'banner bad',text:e.message}))});

}
